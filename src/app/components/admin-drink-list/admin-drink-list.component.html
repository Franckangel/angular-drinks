<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="text-center m-0">Drinks</h1>
  <button class="btn btn-primary" routerLink="create">
    Create Drink
  </button>

</div>

<div class="row">
  @for (drink of drinks; track drink.id) {

    <app-drink-card [isAdmin]="true" [drink]="drink"></app-drink-card>
  </div>
  }
</div>
